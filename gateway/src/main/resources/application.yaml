server:
  port: 8080

spring:
  application:
    name: gateway-service
    
  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: customer-service
              uri: http://localhost:8081
              predicates:
                - Path=/customers/**

            - id: loan-service
              uri: http://localhost:8082
              predicates:
                - Path=/loans/**

            - id: slik-service
              uri: http://localhost:8083
              predicates:
                - Path=/slik/**

            - id: risk-service
              uri: http://localhost:8084
              predicates:
                - Path=/risk/**

            - id: notification-service
              uri: http://localhost:8085
              predicates:
                - Path=/notifications/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway