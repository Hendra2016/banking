server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: customer-service
              uri: http://customer-service:8081
              predicates:
                - Path=/customers**

            - id: loan-service
              uri: http://loan-service:8082
              predicates:
                - Path=/applications**

            - id: slik-service
              uri: http://slik-service:8083
              predicates:
                - Path=/slik**

            - id: risk-service
              uri: http://risk-service:8084
              predicates:
                - Path=/risk**

            - id: notification-service
              uri: http://notification-service:8085
              predicates:
                - Path=/notifications**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"